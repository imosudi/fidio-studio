[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fidio"
version = "0.1.0"
description = "Fídíò Studio — AI-Powered Creative Video Generation Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Fídíò Engineering Team", email = "engineering@fidio.site" }
]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.28.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "sqlalchemy>=2.0.28",
  "asyncpg>=0.29.0",
  "psycopg2-binary>=2.9.9",
  "alembic>=1.13.1",
  "redis>=5.0.3",
  "celery>=5.3.6",
  "boto3>=1.34.60",
  "httpx>=0.27.0",
  "structlog>=24.1.0",
  "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1.0",
  "pytest-asyncio>=0.23.5",
  "pytest-cov>=4.1.0",
  "ruff>=0.3.0",
  "black>=24.2.0"
]

[tool.setuptools.packages.find]
where = ["packages", "apps", "services"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
