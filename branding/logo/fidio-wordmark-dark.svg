<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="500" height="140">
  <defs>
    <linearGradient id="fidioAccentDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="accentGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="140" fill="#090A0F" rx="12" />

  <!-- Logotype Group -->
  <g transform="translate(60, 30)">
    <!-- Letter F -->
    <path d="M 0,20 L 0,80 M 0,20 L 32,20 M 0,46 L 24,46" stroke="#F4F5F7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Letter í (first) -->
    <!-- Base stem -->
    <path d="M 54,40 L 54,80" stroke="#F4F5F7" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Acute Accent motif (Playhead marker 1) -->
    <path d="M 48,26 L 64,12" stroke="url(#fidioAccentDark)" stroke-width="7" stroke-linecap="round" filter="url(#accentGlow)" />

    <!-- Letter d -->
    <path d="M 112,20 L 112,80 M 112,80 C 80,80 76,40 112,40" stroke="#F4F5F7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Letter í (second) -->
    <!-- Base stem -->
    <path d="M 138,40 L 138,80" stroke="#F4F5F7" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Acute Accent motif (Playhead marker 2) -->
    <path d="M 132,26 L 148,12" stroke="url(#fidioAccentDark)" stroke-width="7" stroke-linecap="round" filter="url(#accentGlow)" />

    <!-- Letter ò -->
    <!-- O circle -->
    <circle cx="188" cy="60" r="20" stroke="#F4F5F7" stroke-width="8" fill="none" />
    <!-- Grave accent on o -->
    <path d="M 194,26 L 180,14" stroke="#D1D5DB" stroke-width="6" stroke-linecap="round" />

    <!-- Tagline Subtext -->
    <text x="240" y="52" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#9CA3AF" letter-spacing="2">STUDIO</text>
    <text x="240" y="72" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="400" fill="#6B7280" letter-spacing="1">Imagine. Create. Fídíò.</text>
  </g>
</svg>
