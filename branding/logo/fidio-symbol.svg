<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="symGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="symGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="200" height="200" rx="40" fill="#090A0F" stroke="#26293B" stroke-width="2" />

  <!-- Outer Frame Ring -->
  <circle cx="100" cy="100" r="64" stroke="#1E202E" stroke-width="4" fill="none" />

  <!-- Dual Playhead Accents & Creative Motion Mark -->
  <g transform="translate(100, 100)">
    <!-- Playhead 1 (Left accent stem) -->
    <path d="M -24,-36 L -8,-52 L -8,28 L -24,44 Z" fill="url(#symGrad)" filter="url(#symGlow)" />
    <!-- Playhead 2 (Right accent stem) -->
    <path d="M 8,-44 L 24,-60 L 24,20 L 8,36 Z" fill="url(#symGrad)" filter="url(#symGlow)" />
    <!-- Connecting Horizontal Frame Cut -->
    <path d="M -24,-4 L 36,-4" stroke="#F4F5F7" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
