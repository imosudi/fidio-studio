    <path d="M 138,40 L 138,80" stroke="#090A0F" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M 132,26 L 148,12" stroke="url(#fidioAccentLight)" stroke-width="7" stroke-linecap="round" />

    <!-- Letter ò -->
    <circle cx="188" cy="60" r="20" stroke="#090A0F" stroke-width="8" fill="none" />
    <path d="M 194,26 L 180,14" stroke="#4B5563" stroke-width="6" stroke-linecap="round" />

    <!-- Tagline Subtext -->
    <text x="240" y="52" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#4B5563" letter-spacing="2">STUDIO</text>
    <text x="240" y="72" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="400" fill="#6B7280" letter-spacing="1">Imagine. Create. Fídíò.</text>
