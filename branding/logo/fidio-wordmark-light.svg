      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="140" fill="#FFFFFF" rx="12" stroke="#E5E7EB" stroke-width="1" />

  <!-- Logotype Group -->
  <g transform="translate(60, 30)">
    <!-- Letter F -->
    <path d="M 0,20 L 0,80 M 0,20 L 32,20 M 0,46 L 24,46" stroke="#090A0F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Letter í (first) -->
