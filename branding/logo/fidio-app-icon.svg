<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="appGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="512" height="512" rx="112" fill="#090A0F" stroke="#26293B" stroke-width="4" />

  <!-- Inner Subtle Ring -->
  <circle cx="256" cy="256" r="160" stroke="#161822" stroke-width="8" fill="none" />

  <!-- App Icon Symbol -->
  <g transform="translate(256, 256)">
    <!-- Playhead Accent 1 -->
    <path d="M -60,-90 L -20,-130 L -20,70 L -60,110 Z" fill="url(#appGrad)" filter="url(#appGlow)" />
    <!-- Playhead Accent 2 -->
    <path d="M 20,-110 L 60,-150 L 60,50 L 20,90 Z" fill="url(#appGrad)" filter="url(#appGlow)" />
    <!-- Horizontal Motion Line -->
    <path d="M -60,-10 L 90,-10" stroke="#F4F5F7" stroke-width="16" stroke-linecap="round" />
  </g>
</svg>
